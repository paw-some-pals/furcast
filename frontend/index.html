<!DOCTYPE html>
<html>
<head>
    <title>Furcast 🐾</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- Step 1: Welcome -->
<div class="page" id="page-welcome">
    <div class="card">
        <div class="paw-header">🐾</div>
        <h1>Hello, welcome to <span class="brand">Furcast</span>!</h1>
        <p class="subtitle">Your helper for predicting how long an animal will stay at your shelter.</p>
        <p class="pick-prompt">Pick your animal to get started</p>
        <div class="animal-buttons">
            <button class="animal-btn" onclick="chooseAnimal('cat')">
                <span class="animal-emoji">🐱</span>
                <span>Cat</span>
            </button>
            <button class="animal-btn" onclick="chooseAnimal('dog')">
                <span class="animal-emoji">🐶</span>
                <span>Dog</span>
            </button>
        </div>
    </div>
</div>

<!-- Step 2: Form -->
<div class="page hidden" id="page-form">
    <div class="card">
        <button class="back-btn" onclick="goBack('page-welcome')">← Back</button>
        <span id="form-emoji" class="form-emoji"></span>
        <h2 class="form-title" id="form-title"></h2>

        <form id="predict-form">
            <input type="hidden" id="animal_species" name="animal_species">

            <label>City</label>
            <input type="text" name="city" placeholder="e.g. Austin">

            <label>Age (years)</label>
            <input type="number" step="0.1" min="0" name="age_intake" placeholder="e.g. 2.5">

            <label>Sex</label>
            <select name="sex">
                <option value="">-- Select --</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Unknown">Unknown</option>
            </select>

            <label>Spayed / Neutered</label>
            <select name="spay_neuter">
                <option value="">-- Select --</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
                <option value="Unknown">Unknown</option>
            </select>

            <label>Intake Date</label>
            <div class="date-row">
                <div class="date-field">
                    <label>Month</label>
                    <input type="number" min="1" max="12" name="intake_month" placeholder="1–12">
                </div>
                <div class="date-field">
                    <label>Day</label>
                    <input type="number" min="1" max="31" name="intake_day" placeholder="1–31">
                </div>
                <div class="date-field">
                    <label>Year</label>
                    <input type="number" name="intake_year" placeholder="e.g. 2024">
                </div>
            </div>

            <label>Intake Condition</label>
            <select name="intake_condition">
                <option value="">-- Select --</option>
                <option value="Normal">Normal</option>
                <option value="Injured">Injured</option>
                <option value="Aged">Aged</option>
                <option value="Sick">Sick</option>
                <option value="Other">Other</option>
                <option value="Feral">Feral</option>
            </select>

            <label>Intake Type</label>
            <select name="intake_type">
                <option value="">-- Select --</option>
                <option value="Stray">Stray</option>
                <option value="Owner Surrender">Owner Surrender</option>
                <option value="Euthanasia Request">Euthanasia Request</option>
                <option value="Other">Other</option>
            </select>

            <label>Breed</label>
            <select name="breed_1" id="breed-select">
                <option value="">-- Select --</option>
            </select>

            <div class="checkbox-row">
                <input type="checkbox" id="mixed-checkbox" name="is_mixed">
                <label for="mixed-checkbox">Mixed breed?</label>
            </div>

            <div id="breed2-section" class="hidden">
                <label>Breed 2</label>
                <select name="breed_2" id="breed2-select">
                    <option value="">-- Select --</option>
                </select>
            </div>

            <div id="size-section" class="hidden">
                <label>Size</label>
                <select name="size" id="size-select">
                    <option value="">-- Select --</option>
                    <option value="Toy">Toy</option>
                    <option value="Small">Small</option>
                    <option value="Medium">Medium</option>
                    <option value="Large">Large</option>
                    <option value="Giant">Giant</option>
                </select>
            </div>

            <label>Colour</label>
            <select name="colour" id="colour-select">
                <option value="">-- Select --</option>
            </select>

            <p id="error-msg"></p>

            <button type="submit" class="submit-btn">Predict 🔮</button>
        </form>
    </div>
</div>

<!-- Step 3: Result -->
<div class="page hidden" id="page-result">
    <div class="card result-card">
        <button class="back-btn" onclick="goBack('page-form')">← Back</button>
        <span id="result-emoji" class="result-emoji"></span>
        <p class="result-label">Estimated length of stay</p>
        <p class="result-days" id="result-days">—</p>
        <p class="result-unit">days in shelter</p>
        <button class="try-again-btn" onclick="goBack('page-welcome')">Try another animal</button>
    </div>
</div>

<script src="/app.js"></script>

</body>
</html>
